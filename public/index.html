<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguidores Scrapper Instagram</title>
  <style>
    * {
      font-family: Georgia, "Times New Roman", serif !important;
      box-sizing: border-box;
    }

    body {
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      background-color: #111;
      padding: 2em 1em;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      gap: 2em;
    }

    .container header {
      font-weight: 700;
      font-style: italic;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: row;
      gap: 1em;
      text-align: left;
    }

    .logo-text {
      font-size: 2em;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      line-height: 1.05;
    }

    .codeBox__wrapper {
      display: flex;
      max-width: 930px;
      width: 100%;
      flex-direction: column;
      gap: 2em;
      align-items: center;
    }

    .codeBox {
      width: 100%;
      font-size: 10px;
      user-select: none;
      margin: 0 auto;
      margin-top: 10px;
    }

    pre {
      border-radius: 1em;
      overflow: hidden !important;
      margin: 0;
      background: #fff;
      padding: 0;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
    }

    .codeBox pre {
      max-height: 4.5em;
      overflow: hidden;
    }

    code {
      display: block;
      padding: 1em 0;
      color: #111;
      font-family: Consolas, Monaco, "Courier New", monospace !important;
      font-weight: 700;
      white-space: nowrap;
      overflow-x: auto;
      user-select: none;
      pointer-events: none;
    }

    .copy-button {
      padding: 0.6em 1em;
      width: 100%;
      max-width: 320px;
      color: #fff;
      background-color: #222;
      border: none;
      border-radius: 1em;
      font-size: 2em;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      transition-duration: 300ms;
      text-decoration: none;
    }

    .copy-button:hover:not(:disabled) {
      background-color: #333;
    }

    .copy-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .copy-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .confirm-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      color: #fff;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition-duration: 100ms;
      background-color: #38d1d1;
      padding: 1em;
    }

    .confirm-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .confirm-box {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 2em;
      text-align: center;
    }

    .confirm-box__header__text {
      font-size: 2em;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 0.4em;
    }

    .confirm-box__close button {
      padding: 0.4em 1em;
      background-color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1.25em;
      color: #111;
      cursor: pointer;
    }

    .confirm-box__body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1em;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>

  <script>
    let instagramScript = '';

    async function cargarScriptExtractor() {
      const payload = document.getElementById('extractor-code');
      if (payload && payload.textContent.trim()) {
        return JSON.parse(payload.textContent);
      }
      return '';
    }

    function mostrarEstadoListo() {
      const codeEl = document.getElementById('code');
      if (codeEl) {
        codeEl.textContent = 'Listo. Pulsa «Copy code» y pega en la consola de Instagram.';
      }
    }

    async function initCopyPage() {
      const copyBtn = document.getElementById('copy-btn');
      instagramScript = await cargarScriptExtractor();

      if (!instagramScript) {
        const codeEl = document.getElementById('code');
        if (codeEl) {
          codeEl.textContent = 'Falta el bundle. Ejecuta: node scripts/build.js otros/tu-archivo.js';
        }
        return;
      }

      mostrarEstadoListo();
      if (copyBtn) {
        copyBtn.disabled = false;
      }
    }

    async function copyToClipboard() {
      if (!instagramScript) {
        return;
      }
      try {
        await navigator.clipboard.writeText(instagramScript);
        overlayControl('show');
      } catch (error) {
        console.error('Failed to copy text:', error);
      }
    }

    function overlayControl(state) {
      const overlay = document.getElementById('overlay');
      if (!overlay) return;

      if (state === 'show') {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    initCopyPage();
  </script>

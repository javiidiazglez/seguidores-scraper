<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguidores Scrapper Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111;
      --surface: #1c1c1c;
      --surface-raised: #252525;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --bar-bg: #f4f4f5;
      --bar-text: #18181b;
      --radius: 1rem;
      --radius-pill: 999px;
      --column: min(540px, 100%);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      gap: 2.25rem;
    }

    .container header {
      width: var(--column);
      text-align: center;
      padding-bottom: 0.25rem;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-text__main {
      display: block;
      font-size: clamp(1.875rem, 5.5vw, 2.625rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
    }

    .logo-text__sub {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .hub {
      display: flex;
      width: var(--column);
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
    }

    .hub__hint {
      border-radius: var(--radius-pill);
      margin: 0;
      background: var(--bar-bg);
      padding: 1rem 1.35rem;
      color: var(--bar-text);
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    }

    .hub__link {
      padding: 0.875rem 1.25rem;
      width: 100%;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .hub__link:hover {
      background-color: var(--surface-raised);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .hub__link:active {
      transform: translateY(1px);
    }

    .hub__link svg {
      flex-shrink: 0;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-text">
        <span class="logo-text__main">Seguidores Scrapper</span>
        <span class="logo-text__sub">Instagram</span>
      </div>
    </header>

    <nav class="hub" aria-label="Scripts disponibles">
      <p class="hub__hint">Elige una ruta para copiar el script en la consola de Instagram.</p>

      <a class="hub__link" data-route="extraer" href="extraer/">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 21h16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Extraer
      </a>

      <a class="hub__link" data-route="comparar" href="comparar/">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 7h10M7 12h6M7 17h8M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Comparar
      </a>
    </nav>
  </div>
  <script>
    (function () {
      var isFile = location.protocol === 'file:';
      document.querySelectorAll('[data-route]').forEach(function (link) {
        var route = link.getAttribute('data-route');
        link.href = isFile ? route + '/index.html' : route + '/';
      });
    })();
  </script>
</body>
</html>

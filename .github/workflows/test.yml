name: Test

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run comparador unit tests
        run: npm test
